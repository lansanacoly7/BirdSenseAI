[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "birdsense-analytics"
version = "0.1.0"
description = "Module Analytics — BirdSense AI (Pathé Fall)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "httpx>=0.27.0",
    "locust>=2.29.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: Tests nécessitant une base de données réelle",
    "unit: Tests unitaires purs (pas de réseau ni de DB)",
]
