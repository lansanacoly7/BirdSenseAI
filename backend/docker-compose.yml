version: "3.8"

services:
  api:
    build: .
    container_name: birdsense_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      # Sur dev local, on se connecte via Docker à Supabase (si l'URL est dans .env)
      # ou on surcharge ici.
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=True
      - REDIS_URL=redis://redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: birdsense_redis
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    container_name: birdsense_celery_worker
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - api
